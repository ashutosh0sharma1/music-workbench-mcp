name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  listening-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements.txt
      - run: |
          python -m unittest test_gemini_server -v
